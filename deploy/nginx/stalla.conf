# Reverse proxy per il Gestionale Stalla Ciravolo
# Da installare sulla macchina dove gira Wings (o su qualsiasi server che raggiunga il nodo).
# Sostituisci: stalla.tuodominio.it, IP_NODO e PORTA (allocazione del server in Pterodactyl).
# Certificato: sudo certbot --nginx -d stalla.tuodominio.it

server {
    listen 80;
    server_name stalla.tuodominio.it;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name stalla.tuodominio.it;

    ssl_certificate     /etc/letsencrypt/live/stalla.tuodominio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stalla.tuodominio.it/privkey.pem;

    client_max_body_size 25m;   # upload immagini e file Excel

    location / {
        proxy_pass http://IP_NODO:PORTA;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
