# Reverse proxy per il Gestionale Stalla Ciravolo
#
# Caso tipico: sulla stessa macchina nginx serve già il pannello Pterodactyl sulla 443.
# Questo è solo un ALTRO "server {}" con un nome di dominio diverso: nginx sceglie quale
# sito mostrare in base al nome digitato nel browser (anche con lo stesso IP e la stessa porta 443).
#
# 1. Sostituisci stalla.tuodominio.it con il tuo dominio (es. stalla.mionome.freeddns.org)
#    e 25572 con la porta dell'allocazione del server della stalla.
# 2. Copia il file in /etc/nginx/sites-available/stalla.conf e attivalo (vedi README, sezione 3).
# 3. Esegui certbot: aggiunge da solo il blocco HTTPS (porta 443), il certificato e il
#    reindirizzamento da http a https. Non serve scrivere a mano la parte SSL.

server {
    listen 80;
    listen [::]:80;
    server_name stalla.tuodominio.it;

    # upload di immagini e del file Excel del listino
    client_max_body_size 25m;

    location / {
        # Usa lo STESSO IP dell'allocazione che vedi nel pannello (Server → Network):
        #  - allocazione 0.0.0.0 o 127.0.0.1  → http://127.0.0.1:25572
        #  - allocazione sull'IP pubblico     → http://IP_PUBBLICO:25572
        proxy_pass http://127.0.0.1:25572;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
